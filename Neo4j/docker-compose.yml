# =============================================================================
# Hito 5 — Módulo de Grafos del Fixture 2030 (Grupo 12)
#
# Ambiente local de Neo4j para el subgrafo del Mundial 2030.
#   docker compose up -d          -> levanta el servicio
#   http://localhost:7474         -> Neo4j Browser
#   neo4j://localhost:7687        -> Bolt (drivers / Neo4j Desktop)
#
# RNF1: la imagen es neo4j:latest (sin fijar versión).
# RNF2: /data y /logs persisten en volúmenes NOMBRADOS de Docker.
# RNF8: las credenciales se toman de variables de entorno (.env), nunca
#       están escritas en este archivo.
# =============================================================================

services:
  neo4j:
    image: neo4j:latest
    container_name: fixture2030-neo4j
    restart: unless-stopped

    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # Neo4j Browser (cliente web)
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt (cypher-shell, drivers, Desktop)

    environment:
      # Credenciales de desarrollo: se resuelven desde .env (ver .env.example).
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-fixture2030}"

      # APOC (utilidades) y Graph Data Science (algoritmos de grafos, RF9).
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"

      # Habilita LOAD CSV desde el directorio de importación del contenedor.
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "true"

      # Memoria acotada para no saturar la notebook del equipo.
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"

    volumes:
      # --- Persistencia (RNF2): volúmenes nombrados -------------------------
      - neo4j_data:/data      # base de datos: sobrevive a stop/down
      - neo4j_logs:/logs      # logs del servidor
      - neo4j_plugins:/plugins

      # --- Insumos del repositorio: bind mounts -----------------------------
      # Deben ser bind mounts (no volúmenes nombrados) porque su contenido
      # está versionado en git y debe poder editarse desde la notebook.
      #
      # ./import NO puede montarse como :ro — el entrypoint de neo4j:latest
      # hace chown sobre el directorio de importación al arrancar y falla en un
      # sistema de archivos de solo lectura, dejando el contenedor en bucle de
      # reinicio. ./queries sí admite :ro porque no es una ruta gestionada por
      # el entrypoint.
      - ./import:/var/lib/neo4j/import      # CSVs para LOAD CSV (file:///)
      - ./queries:/queries:ro               # scripts .cypher para cypher-shell

    healthcheck:
      # cypher-shell responde únicamente cuando la base acepta consultas.
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_USER:-neo4j} -p $${NEO4J_PASSWORD:-fixture2030} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

    networks:
      - fixture2030-network

volumes:
  neo4j_data:
    name: fixture2030_neo4j_data
  neo4j_logs:
    name: fixture2030_neo4j_logs
  neo4j_plugins:
    name: fixture2030_neo4j_plugins

networks:
  fixture2030-network:
    driver: bridge
