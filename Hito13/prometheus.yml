global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/reglas-o-alertas.yml

scrape_configs:
  # Prometheus se monitorea a si mismo (metrica "up" trivial, util para
  # confirmar que el propio Prometheus esta funcionando).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # API integrada del Hito 10: metricas de aplicacion (RED), instrumentadas
  # a mano en app/main.py. Se accede por host.docker.internal porque la
  # API corre en el host, no en un contenedor.
  - job_name: fixture2030_api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          componente: "API FastAPI"

  # Redis: exporter dedicado -> metricas reales de infraestructura
  # (memoria, clientes conectados, comandos procesados, uptime).
  - job_name: redis
    static_configs:
      - targets: ["redis_exporter:9121"]
        labels:
          componente: "Redis (sesiones)"

  # MongoDB: exporter dedicado -> metricas reales de infraestructura
  # (conexiones, opcounters, uptime).
  - job_name: mongodb
    static_configs:
      - targets: ["mongodb_exporter:9216"]
        labels:
          componente: "MongoDB (selecciones/jugadores)"

  # Neo4j, Cassandra, InfluxDB e IRIS: sin exporter dedicado instalado en
  # este laboratorio (Neo4j Community y Cassandra no exponen metricas
  # Prometheus sin agentes adicionales; IRIS Community tampoco). Se usa
  # blackbox_exporter como senal de disponibilidad por TCP (RNF3: se
  # documenta explicitamente que esto NO es una metrica interna del
  # producto, solo "hay un listener aceptando conexiones en ese puerto").
  - job_name: blackbox_tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - host.docker.internal:7687   # Neo4j Bolt
        labels:
          componente: "Neo4j (grafo de partidos/eventos)"
      - targets:
          - host.docker.internal:9042   # Cassandra CQL
        labels:
          componente: "Cassandra (comentarios)"
      - targets:
          - host.docker.internal:8181   # InfluxDB HTTP
        labels:
          componente: "InfluxDB (estadisticas temporales)"
      - targets:
          - host.docker.internal:1972   # IRIS Superserver
        labels:
          componente: "IRIS (entidades complejas)"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115
